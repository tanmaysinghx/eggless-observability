spring:
  # Load Portal SSO secrets from a git-ignored .env (repo root or eggless-server dir); real env vars still win.
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: eggless-observability

  # Database Configuration:
  # Defaults to embedded persistent file-based H2 in ~/.eggless/data/egglessdb
  # Easily shift to PostgreSQL or MySQL by setting DB_URL, DB_USERNAME, DB_PASSWORD
  datasource:
    url: ${DB_URL:jdbc:h2:file:${EGGLESS_HOME:${user.home}/.eggless}/data/egglessdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:FRAMEWORK}
  compression:
    enabled: true
    mime-types: text/html,text/css,text/plain,application/javascript,text/javascript,application/json,image/svg+xml
    min-response-size: 1024

eggless:
  home: ${EGGLESS_HOME:${user.home}/.eggless}
  # Public address of this Eggless instance, sent to Portal when connecting. Defaults to the address
  # the operator's browser is using.
  public-url: ${EGGLESS_PUBLIC_URL:}
  # Guards "Connect with Portal SSO". Generated into ~/.eggless/secrets/setupToken and printed at
  # startup when unset.
  setup-token: ${EGGLESS_SETUP_TOKEN:}
  # Base64 32-byte AES key for the stored Portal credentials. Generated into
  # ~/.eggless/secrets/connection.key when unset; back it up with the database.
  secret-key: ${EGGLESS_SECRET_KEY:}
  ingest:
    # Log ingestion (POST /api/v1/logs, /logs/ingest, /logs/batch) requires an API key from
    # Settings → API Keys, sent as X-API-Key. Set to false only on a trusted network.
    require-api-key: ${EGGLESS_INGEST_REQUIRE_API_KEY:true}
  retention:
    # Logs older than this are deleted hourly. 0 keeps logs forever.
    days: ${EGGLESS_RETENTION_DAYS:7}
  alerts:
    evaluation-interval-ms: ${EGGLESS_ALERT_INTERVAL_MS:30000}

# Portal SSO Integration Configuration
# Two ways to configure it:
#   1. "Connect with Portal SSO" on the /setup screen: no secrets to copy; they are stored encrypted.
#   2. Environment variables below. If PORTAL_CLIENT_SECRET or PORTAL_API_KEY is set, the
#      environment wins and option 1 is disabled.
portal:
  sso:
    base-url: ${PORTAL_URL:}
    application-id: ${PORTAL_APP_ID:}
    app-key: ${PORTAL_API_KEY:}
    client-id: ${PORTAL_CLIENT_ID:eggless-observability}
    client-secret: ${PORTAL_CLIENT_SECRET:}
    redirect-uri: ${PORTAL_REDIRECT_URI:}
    scopes: ${PORTAL_SCOPES:openid profile email}
    login-endpoint: ${PORTAL_LOGIN_ENDPOINT:}
    register-endpoint: ${PORTAL_REGISTER_ENDPOINT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
