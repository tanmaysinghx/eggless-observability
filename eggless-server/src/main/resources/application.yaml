spring:
  # Load Portal SSO secrets from a git-ignored .env (repo root or eggless-server dir); real env vars still win.
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: eggless-observability

  # Database Configuration:
  # Defaults to embedded persistent file-based H2 in ~/.eggless/data/egglessdb
  # Easily shift to PostgreSQL or MySQL by setting DB_URL, DB_USERNAME, DB_PASSWORD
  datasource:
    url: ${DB_URL:jdbc:h2:file:${EGGLESS_HOME:${user.home}/.eggless}/data/egglessdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:FRAMEWORK}
  compression:
    enabled: true
    mime-types: text/html,text/css,text/plain,application/javascript,text/javascript,application/json,image/svg+xml
    min-response-size: 1024

# Portal SSO Integration Configuration
# Secrets (PORTAL_CLIENT_SECRET, PORTAL_API_KEY) have no defaults: supply them via env / secret store.
portal:
  sso:
    base-url: ${PORTAL_URL:https://portal.tanmaysinghx.com}
    application-id: ${PORTAL_APP_ID:5de93ba7-0673-4fba-8e9b-a1bdb8466f03}
    app-key: ${PORTAL_API_KEY:}
    client-id: ${PORTAL_CLIENT_ID:eggless-observability}
    client-secret: ${PORTAL_CLIENT_SECRET:}
    redirect-uri: ${PORTAL_REDIRECT_URI:https://eggless.tanmaysinghx.com/auth/callback}
    scopes: ${PORTAL_SCOPES:openid profile email}
    login-endpoint: ${PORTAL_LOGIN_ENDPOINT:}
    register-endpoint: ${PORTAL_REGISTER_ENDPOINT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
