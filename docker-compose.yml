version: '3.8'

services:
  eggless:
    build:
      context: .
      dockerfile: Dockerfile
    image: eggless-observability:latest
    container_name: eggless-observability
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      EGGLESS_HOME: "/home/eggless/.eggless"
      PORTAL_BASE_URL: "${PORTAL_BASE_URL:-https://portal.tanmaysinghx.com}"
      PORTAL_APP_ID: "${PORTAL_APP_ID:-3fa85f64-5717-4562-b3fc-2c963f66afa6}"
      PORTAL_APP_KEY: "${PORTAL_APP_KEY:-}"
      PORTAL_CLIENT_ID: "${PORTAL_CLIENT_ID:-eggless-observability}"
    volumes:
      - eggless-data:/home/eggless/.eggless/data
    restart: always

volumes:
  eggless-data:
