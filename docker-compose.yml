version: '3.8'

services:
  eggless:
    build:
      context: .
      dockerfile: Dockerfile
    image: eggless-observability:latest
    container_name: eggless-observability
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      EGGLESS_HOME: "/home/eggless/.eggless"
      PORTAL_URL: "${PORTAL_URL:-https://portal.tanmaysinghx.com}"
      PORTAL_CLIENT_ID: "${PORTAL_CLIENT_ID:-eggless-observability}"
      PORTAL_APP_ID: "${PORTAL_APP_ID:-5de93ba7-0673-4fba-8e9b-a1bdb8466f03}"
      PORTAL_REDIRECT_URI: "${PORTAL_REDIRECT_URI:-https://eggless.tanmaysinghx.com/auth/callback}"
      PORTAL_SCOPES: "${PORTAL_SCOPES:-openid profile email}"
      # Secrets: set in .env (git-ignored) or your secret manager
      PORTAL_CLIENT_SECRET: "${PORTAL_CLIENT_SECRET:-}"
      PORTAL_API_KEY: "${PORTAL_API_KEY:-}"
      PORTAL_LOGIN_ENDPOINT: "${PORTAL_LOGIN_ENDPOINT:-}"
      PORTAL_REGISTER_ENDPOINT: "${PORTAL_REGISTER_ENDPOINT:-}"
    volumes:
      # Whole home, not just data/: secrets/ holds the setup token and the key that decrypts the
      # stored Portal credentials. Losing it on a container recreate breaks the connection.
      - eggless-data:/home/eggless/.eggless
    restart: always

volumes:
  eggless-data:
