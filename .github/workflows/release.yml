name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'eggless-client/package-lock.json'

      # 1. Build Angular Frontend
      - name: Install Frontend Dependencies
        working-directory: ./eggless-client
        run: npm ci

      - name: Build Angular App
        working-directory: ./eggless-client
        run: npm run build

      # 2. Bundle Frontend into Spring Boot static resources
      - name: Bundle Frontend into Static Resources
        run: |
          mkdir -p eggless-server/src/main/resources/static
          cp -r eggless-client/dist/eggless-client/browser/* eggless-server/src/main/resources/static/

      # 3. Package Spring Boot Standalone Executable JAR
      - name: Package Spring Boot Standalone JAR
        working-directory: ./eggless-server
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      # 4. Build Java SDK
      - name: Build Java SDK
        working-directory: ./eggless-sdk-java
        run: mvn clean package -DskipTests

      # 5. Generate Checksums
      - name: Generate Checksums
        run: |
          cd eggless-server/build/libs
          sha256sum eggless-observability.jar > eggless-observability.jar.sha256
          echo "SHA256: $(cat eggless-observability.jar.sha256)"

      # 6. Publish GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Eggless Observability ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            eggless-server/build/libs/eggless-observability.jar
            eggless-server/build/libs/eggless-observability.jar.sha256
            eggless-sdk-java/eggless-java-core/target/*.jar
            eggless-sdk-java/eggless-logback-appender/target/*.jar
            eggless-sdk-java/eggless-spring-boot-starter/target/*.jar
          body: |
            ## Eggless Observability Platform (Standalone Executable JAR)

            ### Direct Download (Single Runnable Artifact)
            The standalone JAR contains **both** the backend API/WebSocket engine and the Angular Web UI embedded within a single executable:
            
            - **[eggless-observability.jar](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_name || github.ref_name }}/eggless-observability.jar)** (Fat JAR, includes Angular Console SPA)
            - **[eggless-observability.jar.sha256](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_name || github.ref_name }}/eggless-observability.jar.sha256)**

            ### Quick Start (Java 25+)
            ```bash
            # 1. Download
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_name || github.ref_name }}/eggless-observability.jar

            # 2. Run with Embedded Persistent H2 (Zero Setup)
            java -jar eggless-observability.jar
            ```

            Open **`http://localhost:8080`** in your browser.

            ### Custom Database (PostgreSQL / MySQL)
            ```bash
            DB_URL=jdbc:postgresql://localhost:5432/eggless DB_USERNAME=postgres DB_PASSWORD=secret java -jar eggless-observability.jar
            ```
