name: Eggless Platform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'eggless-client/package-lock.json'

      - name: Install Dependencies
        working-directory: ./eggless-client
        run: npm ci

      - name: Build Angular App
        working-directory: ./eggless-client
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eggless-frontend-dist
          path: ./eggless-client/dist/eggless-client/browser/

  build-server:
    name: Build Spring Boot Executable JAR
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: eggless-frontend-dist
          path: ./eggless-server/src/main/resources/static/

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: ./eggless-server
        run: chmod +x gradlew

      - name: Build & Test Executable JAR
        working-directory: ./eggless-server
        run: ./gradlew build

      - name: Upload Standalone JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eggless-observability-jar
          path: ./eggless-server/build/libs/eggless-observability.jar
