name: Eggless Platform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'eggless-client/package-lock.json'

      - name: Install Dependencies
        working-directory: ./eggless-client
        run: npm ci

      - name: Build Angular App
        working-directory: ./eggless-client
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eggless-frontend-dist
          path: ./eggless-client/dist/eggless-client/browser/

  build-backend:
    name: Build Go Backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: 'eggless-server/go.sum'

      - name: Build Binary
        working-directory: ./eggless-server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUTPUT_NAME=eggless-server-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then OUTPUT_NAME="${OUTPUT_NAME}.exe"; fi
          go build -o $OUTPUT_NAME .

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eggless-backend-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./eggless-server/eggless-server-*
