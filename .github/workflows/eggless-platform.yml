name: Eggless Platform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'eggless-client/package-lock.json'

      - name: Install Dependencies
        working-directory: ./eggless-client
        run: npm ci

      - name: Build Angular App
        working-directory: ./eggless-client
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eggless-frontend-dist
          path: ./eggless-client/dist/eggless-client/browser/

  build-server:
    name: Build Spring Boot Executable JAR
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: eggless-frontend-dist
          path: ./eggless-server/src/main/resources/static/

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: ./eggless-server
        run: chmod +x gradlew

      - name: Build & Test Executable JAR
        working-directory: ./eggless-server
        run: ./gradlew build

      - name: Upload Standalone JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eggless-observability-jar
          path: ./eggless-server/build/libs/eggless-observability.jar

  release:
    name: Auto Release & Tag
    runs-on: ubuntu-latest
    needs: [build-frontend, build-server]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download compiled JAR
        uses: actions/download-artifact@v4
        with:
          name: eggless-observability-jar
          path: dist/

      - name: Prepare Release Artifacts
        id: prep
        run: |
          JAR_FILE=$(find dist -name "*.jar" ! -name "*.original" | head -n 1)
          cp "$JAR_FILE" ./eggless-observability.jar
          sha256sum eggless-observability.jar > eggless-observability.jar.sha256
          TAG="v25.0.${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Prepared release for tag: $TAG"

      - name: Create GitHub Release and Git Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Eggless Observability ${{ steps.prep.outputs.tag }} (LTS 25)
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            eggless-observability.jar
            eggless-observability.jar.sha256
          body: |
            ## Eggless Observability Standalone Executable (Single Runnable JAR)

            ### Direct Download
            - **[eggless-observability.jar](https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/eggless-observability.jar)** (Standalone Fat JAR with embedded Angular 21 Console)
            - **[eggless-observability.jar.sha256](https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/eggless-observability.jar.sha256)**

            ### Quick Start (Java 25+)
            ```bash
            # 1. Download
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/eggless-observability.jar

            # 2. Run with Embedded Persistent H2 (Zero Setup)
            java -jar eggless-observability.jar
            ```

            Open **http://localhost:8080** in your browser.

            ### Custom Database (PostgreSQL / MySQL)
            ```bash
            # Shift to PostgreSQL
            DB_URL=jdbc:postgresql://localhost:5432/eggless DB_USERNAME=postgres DB_PASSWORD=secret java -jar eggless-observability.jar

            # Shift to MySQL
            DB_URL=jdbc:mysql://localhost:3306/eggless DB_USERNAME=root DB_PASSWORD=secret java -jar eggless-observability.jar
            ```
